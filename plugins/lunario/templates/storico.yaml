# Storico — quello che il sistema ha imparato.
# Lo scrive `lunario:postmortem`, non tu. Leggerlo va benissimo, correggerlo a
# mano anche: se una taratura ti sembra sbagliata, cambiala e diglielo.

tarature:
  # Porzioni personalizzate, in grammi, per persona e alimento. Vuoto = si
  # usano le porzioni standard CREA scalate sulle calorie del profilo.
  # Si riempie da solo: se un piatto avanza per due settimane, la porzione cala.
  porzioni_g: {}

  # Piatti usciti definitivamente di scena (media a tavola sotto 2, due volte).
  piatti_esclusi: []

  # I voti, che sono due cose diverse e non vanno mescolate:
  #   cucina  -> lo da' chi ha cucinato, appena finito (lunario:prepara)
  #              difficolta' 1-5 e minuti veri: tarano DOVE va il piatto nella
  #              settimana, non se ci va
  #   tavola  -> lo danno i commensali al postmortem (lunario:postmortem)
  #              media 1-5: tara SE il piatto resta in rotazione
  # Un piatto puo' essere ottimo a tavola e insostenibile il mercoledi' sera.
  voti: {}
  # esempio:
  #   Pasta e ceci:
  #     cucina: {difficolta: 1, minuti_reali: 25, voto_cuoco: 4, volte: 3}
  #     tavola: {media: 4.3, voti: [{data: 2026-08-17, chi: Bimbo1, voto: 3}]}

  # Le pesate, per chi ha `pesata_settimanale: true` nel profilo. Le chiede il
  # postmortem, una domanda sola e saltabile. Servono a vedere il TREND, non
  # il numero: il peso oscilla di 1-2 kg per acqua, sale e sonno, e leggere la
  # singola pesata come un voto e' il modo migliore per mollare tutto.
  # Formato: una riga per pesata, mai sovrascritta.
  pesate: {}
  # esempio:
  #   Adulto1:
  #     - {data: 2026-08-16, kg: 75.4}
  #     - {data: 2026-08-23, kg: 75.1}

  # Budget settimanale in euro. null = nessun tetto, il sistema non commenta.
  # Riguarda la spesa del menu: quello che si mangia fuori sta per conto suo,
  # in `spesa_fuori_casa` di ogni settimana.
  budget_settimana_eur: null

# Una voce per settimana, aggiunta dal menu e completata dal postmortem.
# Oltre a titolo, spesa stimata e reale, ogni voce porta due campi che
# riguardano la griglia dei pasti:
#   spesa_fuori_casa -> ristorante, pizzeria, bar. Alimentare, ma non spesa di
#                       Lunario: non si somma a spesa_reale, altrimenti il
#                       confronto con la stima non vuol dire piu' niente
#   celle_disattese  -> previsto a casa, finito fuori (o il contrario). Tre
#                       volte la stessa cella non e' sfortuna: e' un ritmo che
#                       nessuno ha ancora scritto in ritmi.yaml
settimane: []
