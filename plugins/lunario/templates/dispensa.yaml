# Dispensa — cosa c'e' in casa.
# Copia in dati/dispensa.yaml (resta locale, gitignored), oppure lascia che
# sia il sistema a crearlo: lo aggiorna da solo a ogni menu e a ogni postmortem.
#
# Serve a non ricomprare ogni lunedi' la pasta di cui resta mezzo pacco:
# il fabbisogno della settimana si scala di quello che c'e' gia'.
#
# TRE sezioni, e sono tre cose diverse:
#   scorte   cio' che la casa TIENE in casa. L'ha CONTATO un essere umano,
#            grossolanamente, e dura mesi
#   avanzi   cio' che il motore ha CALCOLATO: comprato meno consumato. Preciso,
#            in grammi, e dura una settimana o due
#   freezer  cio' che l'utente ha VISTO aprendo lo sportello, con la data
# Confonderle e' il modo piu' rapido di avere un inventario di cui non ci si
# fida piu'. Regole complete in kb/scorte.md.

aggiornata: 2026-08-14

scorte:
  # La dotazione fissa di casa. La riempie `lunario:inventario`, una volta, a
  # voce o dalle foto degli scaffali — non si compila a mano, mai: l'inserimento
  # manuale e' la causa di morte di ogni app di dispensa.
  # Chiave = id in prodotti.jsonl quando c'e', testo libero quando non c'e'.
  pasta-integrale-500:
    quantita: 4            # confezioni intere, OPPURE una banda:
                           #   pieno | medio | poco | finito
                           # Nessuno pesa la farina, e non serve.
    soglia: 2              # sotto, il prodotto torna in lista della spesa
    massimo: 6             # sopra, NON si compra piu'. E' il campo che ferma
                           # il quinto pacco: l'errore che nessuno nota
    visto: 2026-08-14      # quando un essere umano l'ha confermata l'ultima
                           # volta. Il movimento automatico non lo tocca MAI
    rotazione: alta        # alta|media|bassa: ogni quanto rivisitarla
  passata-700:
    quantita: poco
    soglia: 3
    visto: 2026-07-04      # vecchia: la fetta del lunedi' chiedera' questa

# La FIDUCIA non si scrive, si calcola da `visto`, `rotazione` e da quanto il
# menu si appoggia a quella riga: fresca (si sottrae in silenzio), invecchiata
# (si sottrae e si dichiara nel menu), stantia (non ci si fida, si conta prima
# di generare). Il motore non deve avere ragione: deve sapere quanto e' vecchia
# la sua convinzione.

avanzi:
  # chiave = id del prodotto in dati/prodotti.jsonl
  trofie-500: 400          # grammi residui (tipo `confezione`)
  uova-6: 4                # pezzi interi (tipo `pezzo`)

# SOLO prodotti non deperibili: dispensa secca, scatolame, surgelati, uova,
# formaggi stagionati. Mezza busta di rucola NON si scrive qui: fra tre giorni
# non esiste, e pianificarci sopra la settimana dopo significa cucinare marcio.

freezer:
  # Il congelatore e' un'altra cosa dagli avanzi, e per questo ha una sezione
  # sua. `avanzi` e' cio' che il motore ha CALCOLATO — comprato meno consumato.
  # Qui c'e' cio' che si VEDE aprendo lo sportello: pezzi arrivati da una
  # spesa di un mese fa, meta' di un pacco, la carne messa via a giugno. Roba
  # gia' pagata, che nessun calcolo conosce e che il menu deve smaltire prima
  # di comprare l'equivalente al banco.
  #
  # Lo riempie `lunario:settimana`, che ogni lunedi' chiede cosa c'e' — e lo
  # chiede mostrando questa lista, perche' correggere un elenco riesce a
  # tutti e ricordarlo a nessuno.
  - cosa: filetti di branzino     # in parole: spesso non e' una riga del paniere
    pezzi: 2
    grammi: 250                   # per pezzo, quando la quantita' conta
    dal: 2026-06-12               # quando e' stato congelato, se si sa
    da_smaltire: true             # e' li' da troppo: esce per primo
  - cosa: petto di pollo a fette
    grammi: 600
  - cosa: scamone
    pezzi: 1
    grammi: 475
    dal: 2026-06-20
    da_smaltire: true

# La data serve piu' del peso: e' con quella che si decide cosa esce per primo.
# E un piatto costruito su una di queste righe porta un vincolo che il menu
# deve stampare — lo SCONGELAMENTO. Una bistecca vuole 12-24 ore in frigo, dei
# filetti 8-12: un surgelato previsto per domenica sera e ricordato domenica
# pomeriggio e' una cena che non si fa, ed e' l'unico pezzo di settimana che
# il giorno stesso non si recupera.
