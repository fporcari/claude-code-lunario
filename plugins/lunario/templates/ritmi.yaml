# Ritmi — la settimana tipo, cio' che si ripete ogni settimana.
# Copia in dati/ritmi.yaml (resta locale, gitignored).
#
# Non serve compilarlo a mano: la skill `lunario:ritmi` lo scrive da una
# conversazione. Questo file mostra solo la forma.
#
# ATTENZIONE alla differenza:
#   qui                     -> "il martedi' pranzo SEMPRE fuori"
#   settimane/<ISO>/        -> "QUESTO martedi' pranzo fuori"
# Un ritmo sbagliato inquina i menu per mesi.

settimana:
  martedi:
    Adulto2:
      # casa | fuori_trasportabile | fuori_autonomo
      pranzo: fuori_trasportabile
      # minuti veri ai fornelli quella sera, se meno del solito
      cena_entro_min: 25
      nota: piscina dopo il lavoro, si cena tardi
  mercoledi:
    Adulto1:
      pranzo: fuori_autonomo      # mensa: il sistema non se ne occupa
  venerdi:
    tutti:
      nota: cena leggera, si mangia presto per i bambini

# I giorni senza vincoli non si scrivono.
# I vincoli che non sono orari (forno guasto, cene dai nonni) vanno in note.md
